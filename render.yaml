services:
  - type: web
    name: momentum-trading-ml-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.saas_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://kjisback.github.io,http://127.0.0.1:8010,http://127.0.0.1:8011,http://localhost:8010,http://localhost:8011
      - key: DEFAULT_ALERT_TICKERS
        value: AAPL,MSFT,GOOGL,AMZN,META
      - key: DEFAULT_ALERT_MODEL
        value: xgboost
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ALERT_RECIPIENTS
        sync: false
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: momentum-weekly-email
    runtime: python
    schedule: "0 13 * * 1"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -c "import os, urllib.request; token=os.getenv('CRON_SECRET',''); urllib.request.urlopen(os.getenv('BACKEND_URL','https://momentum-trading-ml-api.onrender.com') + '/api/cron/weekly-email?token=' + token).read()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        value: https://momentum-trading-ml-api.onrender.com
      - key: DEFAULT_ALERT_TICKERS
        value: AAPL,MSFT,GOOGL,AMZN,META
      - key: DEFAULT_ALERT_MODEL
        value: xgboost
      - key: CRON_SECRET
        sync: false
