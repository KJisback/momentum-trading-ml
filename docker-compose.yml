services:
  momentum-dashboard:
    build: .
    command: uvicorn src.saas_app:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    environment:
      - JWT_SECRET=change-me-in-production
      - ADMIN_ACCESS_CODE=admin-local
      - ALLOWED_ORIGINS=http://127.0.0.1:8010,http://localhost:8010
